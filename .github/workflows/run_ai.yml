name: Endesha BehavioralShield na Groq

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Shusha mradi (Checkout code)
        uses: actions/checkout@v4

      - name: Weka Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sakinisha vifaa vinavyohitajika (Dependencies)
        run: |
          pip install requests

      - name: Endesha faili la Python kwa kutumia API Key ya GitHub Secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 check_models.py

