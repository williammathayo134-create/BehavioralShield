name: Build Kunguge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        pip install --upgrade pip buildozer cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.android
        echo "### License" > ~/.android/repositories.cfg
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> ~/.android/repositories.cfg
        echo -e "d56f5187479451eabf01fb78af6dfcb131a648db" >> ~/.android/repositories.cfg
        echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fb8" >> ~/.android/repositories.cfg
        echo -e "d975f751698a77b660f125453e3a130465d262c2" >> ~/.android/repositories.cfg

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kunguge-apk
        path: bin/*.apk
