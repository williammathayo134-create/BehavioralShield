name: Build Kunguge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components & accept licenses
      run: |
        sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --install "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;23.8.9338270"

    - name: Install dependencies
      run: |
        pip install --upgrade pip buildozer cython==0.29.36

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kunguge-apk
        path: bin/*.apk
        
